<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила флуда · Аниме стиль</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff7eb3;
            --pink-light: #ffb6d5;
            --purple: #a855f7;
            --blue: #7dd3fc;
            --gold: #fbbf24;
            --bg-start: #1a1a2e;
            --bg-end: #16213e;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --text-secondary: #e0e0e0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glow: 0 0 20px rgba(255, 126, 179, 0.5);
            --radius: 20px;
            --transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            position: relative;
            animation: bgShift 15s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { background: linear-gradient(135deg, #1a1a2e, #16213e); }
            50% { background: linear-gradient(135deg, #2d1b3d, #1a1a2e); }
            100% { background: linear-gradient(135deg, #1a1a2e, #0f3460); }
        }

        /* Слой с сакурой */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffb7c5;
            border-radius: 50% 0 50% 50%;
            opacity: 0.7;
            animation: fall linear infinite;
            box-shadow: 0 0 10px rgba(255, 183, 197, 0.5);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) translateX(0);
                opacity: 0.9;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) translateX(200px);
                opacity: 0.2;
            }
        }

        /* Главный контейнер */
        .main-wrapper {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
        }

        /* Заголовок */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            animation: floatIn 1.2s ease-out both;
        }

        .hero h1 {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: clamp(2.5rem, 7vw, 4rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 3s ease-in-out infinite;
            letter-spacing: 0.03em;
            text-shadow: 0 0 30px rgba(255, 126, 179, 0.3);
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 126, 179, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.7)); }
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Карточки */
        .rule-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(50px);
            will-change: transform, opacity, box-shadow;
        }

        .rule-card.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.7s ease-out, transform 0.7s ease-out, box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .rule-card:hover {
            border-color: rgba(255, 126, 179, 0.7);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), var(--glow);
            transform: translateY(-8px) scale(1.02);
        }

        /* Градиентная неоновая рамка при наведении */
        .rule-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: calc(var(--radius) + 2px);
            background: linear-gradient(45deg, var(--pink), var(--purple), var(--blue), var(--pink));
            background-size: 400% 400%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            animation: borderFlow 3s linear infinite;
        }

        .rule-card:hover::before {
            opacity: 0.6;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Номер правила */
        .rule-number {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 0.5rem;
            display: inline-block;
            filter: drop-shadow(0 0 8px rgba(255, 126, 179, 0.4));
            animation: numberPulse 3s ease-in-out infinite;
        }

        @keyframes numberPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .rule-title {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            position: relative;
            display: inline-block;
            transition: var(--transition);
        }

        .rule-card:hover .rule-title {
            text-shadow: 0 0 20px rgba(255, 126, 179, 0.8);
        }

        /* Контент правила */
        .rule-content {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 1rem;
        }

        .rule-content p {
            margin-bottom: 0.8rem;
        }

        /* Наказание */
        .punishment {
            display: inline-block;
            margin-top: 1.2rem;
            padding: 0.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid var(--pink);
            border-radius: 0 12px 12px 0;
            font-weight: 600;
            color: #fff;
            backdrop-filter: blur(5px);
            transition: var(--transition);
            letter-spacing: 0.02em;
        }

        .rule-card:hover .punishment {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 126, 179, 0.3);
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .rule-card {
                padding: 1.2rem 1.2rem;
            }
            .rule-title {
                font-size: 1.5rem;
            }
            .rule-number {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Сакура -->
    <div class="sakura-container" id="sakura"></div>

    <!-- Контент -->
    <main class="main-wrapper">
        <div class="hero">
            <h1>✦ Правила флуда ✦</h1>
        </div>

        <div id="rules-container"></div>
    </main>

    <script>
        // ========== ДАННЫЕ ПРАВИЛ ==========
        const rules = [
            {
                number: "01",
                title: "Конфликты",
                content: `
                    <p>Любые ссоры, ругань, срач, конфликты и т.д. — запрещены. Разбирательства проводим в личные сообщения, но никак не во флуде. Флуд создан для комфортного общения.</p>
                    <p>Все участники конфликта (те, кто начал, подхватил, продолжил, влез) получают своё наказание, в зависимости от решения администрации.</p>
                    <p>Также вызов конфликта фразами «а слабо», «поплачь» и т.д. имеет наказание. Влезать в конфликты не нужно — лучше отмечайте админов или пишите в лички админам.</p>
                `,
                punishment: "Кара: пред / мут / варн / удаление"
            },
            {
                number: "02",
                title: "Оскорбления",
                content: `
                    <p>Оскорбления запрещены так же, как и конфликты. Переход на личности, осуждение человека и всего, что с ним связано, — наказуемо.</p>
                `,
                punishment: "Кара: пред / мут"
            },
            {
                number: "03",
                title: "Табу-темы",
                content: `
                    <p>Запрещается обсуждение политики, порнографии, шок-контента и т.д. Во флуде участники разного возраста, стрессоустойчивости и нервов. Если не жалеете себя, то пожалейте хотя бы их — мы все люди и все разные.</p>
                    <p>За это можно отхватить то или иное наказание в зависимости от решения администрации.</p>
                `,
                punishment: "Кара: мут / варн / удаление"
            },
            {
                number: "04",
                title: "Спам",
                content: `
                    <p>Запрещено присылать более 3 одинаковых сообщений / gif / стикеров / фотографий — это уже спам. Давайте будем держать флуд в чистоте и не засорять его мусором.</p>
                `,
                punishment: "Кара: мут + пред"
            },
            {
                number: "05",
                title: "Ролевая",
                content: `
                    <p>Ролить во флуде запрещено! Только если это пример поста (показать, как пишет человек, сколько, в каком стиле). Посты пишите хотя бы в две строчки, потому что посты типа «сел», «встал», «поел» тяжело продолжить.</p>
                    <p>Сюжет и т.д. обсуждаем во флуде либо в личках, у солора. Посты с 18+, шок-контентом, жестокими сценами и т.д. обязательно блюрить, с отметкой «T/W».</p>
                    <p>В ролевой нельзя убивать чужих и своих персонажей, только НПС.</p>
                `,
                punishment: "Кара: по решению администрации"
            },
            {
                number: "06",
                title: "Чистка × Норма",
                content: `
                    <p>Чистка будет проводиться в воскресенье, в 16:00 по МСК, время может меняться в зависимости от занятости админов.</p>
                    <p>Норма: 150 сообщений. Набирать норму в день чистки запрещено (т.е. у вас 10–40 сообщений, и остальное вы набираете в день чистки).</p>
                `,
                punishment: "Кара: по решению администрации"
            },
            {
                number: "07",
                title: "Рест",
                content: `
                    <p>Рест можно брать от 2 дней до 3 недель, в зависимости от ситуации. При желании взять рест пишите админам либо прямо во флуде, отмечая администрацию.</p>
                `,
                punishment: "—"
            },
            {
                number: "08",
                title: "Жалобы",
                content: `
                    <p>Жаловаться можно на участников и на администрацию, прикладывая веские доказательства (скрины и т.д.). При получении 3 жалоб — вылет.</p>
                `,
                punishment: "Кара: вылет"
            },
            {
                number: "09",
                title: "Роли",
                content: `
                    <p>Роли можно бронировать не больше 3 дней. По истечении срока ваша роль отдаётся другому, если найдётся на неё человек.</p>
                    <p>Можно взять максимум три роли.</p>
                `,
                punishment: "—"
            },
            {
                number: "10",
                title: "Реклама",
                content: `
                    <p>Реклама своих флудов, проектов, КФ, ролок, ботов и т.д. запрещена. По договорённости с администрацией можно будет прорекламировать то, что вы хотели.</p>
                `,
                punishment: "Кара: по решению администрации"
            }
        ];

        // ========== ГЕНЕРАЦИЯ КАРТОЧЕК ==========
        const container = document.getElementById('rules-container');

        rules.forEach((rule, index) => {
            const card = document.createElement('article');
            card.className = 'rule-card';
            card.style.transitionDelay = `${index * 0.03}s`; // для каскада

            card.innerHTML = `
                <div class="rule-number">${rule.number}</div>
                <h2 class="rule-title">${rule.title}</h2>
                <div class="rule-content">${rule.content}</div>
                <div class="punishment">${rule.punishment}</div>
            `;

            container.appendChild(card);
        });

        // ========== НАБЛЮДАТЕЛЬ ЗА ПОЯВЛЕНИЕМ ==========
        const cards = document.querySelectorAll('.rule-card');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.15,
            rootMargin: '0px 0px -50px 0px'
        });

        cards.forEach(card => observer.observe(card));

        // ========== ГЕНЕРАЦИЯ САКУРЫ ==========
        const sakuraContainer = document.getElementById('sakura');
        const petalCount = 25;

        for (let i = 0; i < petalCount; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            // случайные параметры
            const size = Math.random() * 10 + 8; // 8-18px
            const left = Math.random() * 100;
            const delay = Math.random() * 15;
            const duration = Math.random() * 10 + 8; // 8-18s
            const opacity = Math.random() * 0.5 + 0.3;
            const rotation = Math.random() * 360;
            const drift = Math.random() * 300 - 150;

            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${left}%`;
            petal.style.animationDelay = `${delay}s`;
            petal.style.animationDuration = `${duration}s`;
            petal.style.opacity = opacity;
            petal.style.transform = `rotate(${rotation}deg)`;
            petal.style.setProperty('--drift', `${drift}px`);

            // переопределяем keyframes для каждой с учётом drift
            petal.style.animationName = 'fall';
            petal.style.animationTimingFunction = 'linear';
            petal.style.animationIterationCount = 'infinite';
            sakuraContainer.appendChild(petal);
        }

        // Добавляем немного случайного движения по горизонтали
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                0% {
                    transform: translateY(-10vh) rotate(0deg) translateX(0);
                    opacity: 0.9;
                }
                100% {
                    transform: translateY(110vh) rotate(720deg) translateX(var(--drift, 0px));
                    opacity: 0.2;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
