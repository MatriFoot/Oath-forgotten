<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила флуда · Готический стиль</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #030303;
            --bg-1: #0a0a0a;
            --bg-2: #111111;
            --card-bg: rgba(15, 15, 15, 0.85);
            --border: #2c2c2c;
            --border-light: #4a4a4a;
            --text-0: #f0f0f0;
            --text-1: #d0d0d0;
            --text-2: #a0a0a0;
            --text-3: #707070;
            --gold: #c9a86c;
            --glow-gold: 0 0 20px rgba(201, 168, 108, 0.4);
            --glow-strong: 0 0 40px rgba(201, 168, 108, 0.7);
            --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.6);
            --shadow-deep: 0 25px 70px rgba(0, 0, 0, 0.9);
            --radius: 8px;
            --radius-lg: 4px;
            --transition: 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-bounce: 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--bg-0);
            font-family: 'Cormorant Garamond', 'Times New Roman', serif;
            color: var(--text-0);
            overflow-x: hidden;
            position: relative;
            cursor: default;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 100%);
        }

        /* ===== ГЛОБАЛЬНЫЕ ДЕКОРАТИВНЫЕ СЛОИ ===== */
        .bg-gothic {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* Паутина */
        .web {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            transform: scale(1);
            animation: webPulse 8s ease-in-out infinite alternate;
        }

        .web-1 { width: 500px; height: 500px; top: -200px; left: -200px; border-color: rgba(255,255,255,0.08); }
        .web-2 { width: 350px; height: 350px; bottom: -150px; right: -150px; border-color: rgba(255,255,255,0.06); animation-delay: 2s; }
        .web-3 { width: 250px; height: 250px; top: 40%; left: -100px; border-color: rgba(255,255,255,0.04); animation-delay: 4s; }

        @keyframes webPulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.05); opacity: 0.7; }
        }

        /* Виньетка */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 90%);
        }

        /* Пыль */
        .dust {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: dustFloat linear infinite;
            box-shadow: 0 0 6px rgba(255,255,255,0.5);
        }

        @keyframes dustFloat {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-110vh) translateX(60px); opacity: 0; }
        }

        /* Свечи по бокам */
        .candle {
            position: fixed;
            width: 60px;
            height: 200px;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(255,200,100,0.3));
        }

        .candle-left { left: 30px; }
        .candle-right { right: 30px; transform: scaleX(-1); }

        .candle-body {
            position: absolute;
            bottom: 0;
            width: 20px;
            height: 150px;
            background: linear-gradient(90deg, #333, #555, #333);
            border-radius: 8px 8px 0 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .candle-wick {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 10px;
            background: #222;
        }

        .candle-flame {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 20px;
            background: radial-gradient(ellipse at bottom, #fff 0%, #ffd700 40%, #ff8c00 70%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flameFlicker 0.15s ease-in-out infinite alternate;
            filter: blur(1px);
        }

        @keyframes flameFlicker {
            0% { transform: translateX(-50%) scaleY(1) scaleX(1); }
            100% { transform: translateX(-50%) scaleY(1.1) scaleX(0.9); }
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-wrapper {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            padding: 5rem 2rem 5rem;
        }

        /* Заголовок */
        .hero {
            text-align: center;
            margin-bottom: 5rem;
            animation: heroEntrance 1.8s ease-out both;
        }

        @keyframes heroEntrance {
            0% { opacity: 0; transform: translateY(-50px) scale(0.9); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .hero h1 {
            font-family: 'UnifrakturCook', 'Cinzel', serif;
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 700;
            color: #d4c5a0;
            text-shadow: 0 0 30px rgba(201,168,108,0.3), 0 0 60px rgba(201,168,108,0.1);
            letter-spacing: 0.05em;
            animation: titleGlow 5s ease-in-out infinite;
            position: relative;
            display: inline-block;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(201,168,108,0.3), 0 0 40px rgba(201,168,108,0.1); }
            50% { text-shadow: 0 0 40px rgba(201,168,108,0.6), 0 0 80px rgba(201,168,108,0.3); }
        }

        .hero h1::before,
        .hero h1::after {
            content: '⚜';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: #c9a86c;
            text-shadow: 0 0 15px rgba(201,168,108,0.5);
            animation: ornamentSway 3s ease-in-out infinite;
        }

        .hero h1::before { left: -70px; }
        .hero h1::after { right: -70px; }

        @keyframes ornamentSway {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            50% { transform: translateY(-50%) rotate(10deg); }
        }

        /* ===== КАРТОЧКИ ПРАВИЛ ===== */
        .rule-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 2.8rem;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(40px);
            will-change: transform, opacity, box-shadow, border-color;
            isolation: isolate;
        }

        .rule-card.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s ease, border-color 0.5s ease;
        }

        .rule-card:hover {
            border-color: #5a4a2a;
            box-shadow: var(--shadow-deep), var(--glow-gold);
            transform: translateY(-8px);
        }

        /* Светящаяся граница */
        .rule-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--radius) + 2px);
            background: linear-gradient(135deg, #c9a86c, #6b5a3a, #c9a86c, #3a2e1a);
            background-size: 400% 400%;
            z-index: -2;
            opacity: 0;
            transition: opacity 0.6s ease;
            animation: borderFlow 6s linear infinite;
        }

        .rule-card:hover::before {
            opacity: 0.35;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .rule-card::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--radius) + 2px);
            background: inherit;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.6s ease;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .rule-card:hover::after {
            opacity: 1;
        }

        /* Номер правила (готические цифры) */
        .rule-number {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #c9a86c;
            line-height: 1;
            margin-bottom: 0.6rem;
            display: inline-block;
            text-shadow: 0 0 20px rgba(201,168,108,0.5);
            animation: numberGlow 4s ease-in-out infinite;
            letter-spacing: 0.05em;
        }

        @keyframes numberGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(201,168,108,0.3); }
            50% { text-shadow: 0 0 30px rgba(201,168,108,0.8); }
        }

        .rule-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #e0d5b0;
            margin-bottom: 1.2rem;
            position: relative;
            display: inline-block;
            transition: var(--transition);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .rule-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #c9a86c, #8a7a5a);
            transition: width 0.5s ease;
            box-shadow: 0 0 12px rgba(201,168,108,0.6);
        }

        .rule-card:hover .rule-title::after {
            width: 100%;
        }

        .rule-card:hover .rule-title {
            text-shadow: 0 0 35px rgba(201,168,108,0.5);
        }

        /* Контент */
        .rule-content {
            color: var(--text-2);
            line-height: 1.75;
            font-size: 1.05rem;
            margin-top: 0.8rem;
        }

        .rule-content p {
            margin-bottom: 0.7rem;
            position: relative;
            padding-left: 1.2rem;
            transition: color 0.4s ease;
        }

        .rule-content p::before {
            content: '❖';
            position: absolute;
            left: 0;
            color: #6b5a3a;
            font-size: 0.9rem;
            transition: color 0.4s ease;
        }

        .rule-card:hover .rule-content p {
            color: var(--text-1);
        }
        .rule-card:hover .rule-content p::before {
            color: #c9a86c;
        }

        /* Наказание */
        .punishment {
            display: inline-block;
            margin-top: 1.8rem;
            padding: 0.6rem 2rem;
            background: rgba(0,0,0,0.4);
            border-left: 3px solid #c9a86c;
            border-radius: 0 8px 8px 0;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            color: #f0e6c8;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        .punishment::before {
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201,168,108,0.2), transparent);
            transition: left 0.8s ease;
        }

        .rule-card:hover .punishment {
            background: rgba(20,15,5,0.7);
            box-shadow: 0 0 25px rgba(201,168,108,0.3);
            border-left-color: #ffd700;
        }

        .rule-card:hover .punishment::before {
            left: 100%;
        }

        /* Декоративные углы (готический орнамент) */
        .rule-card .corner-decor {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #3a3a3a;
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 1;
        }

        .rule-card .corner-decor.top-left {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
            border-radius: 4px 0 0 0;
        }
        .rule-card .corner-decor.top-right {
            top: 10px;
            right: 10px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 4px 0 0;
        }
        .rule-card .corner-decor.bottom-left {
            bottom: 10px;
            left: 10px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 4px;
        }
        .rule-card .corner-decor.bottom-right {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 4px 0;
        }

        .rule-card:hover .corner-decor {
            opacity: 1;
            border-color: #c9a86c;
        }

        /* Большой номер в фоне */
        .rule-card .bg-number {
            position: absolute;
            right: 15px;
            bottom: -10px;
            font-family: 'UnifrakturCook', serif;
            font-size: 9rem;
            color: rgba(255,255,255,0.03);
            pointer-events: none;
            z-index: 0;
            transition: color 0.4s ease;
            user-select: none;
            line-height: 1;
        }

        .rule-card:hover .bg-number {
            color: rgba(201,168,108,0.08);
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 600px) {
            .rule-card {
                padding: 1.8rem 1.5rem;
            }
            .rule-title {
                font-size: 1.6rem;
            }
            .rule-number {
                font-size: 2.2rem;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
            .hero h1::before,
            .hero h1::after {
                display: none;
            }
            .rule-card .bg-number {
                font-size: 6rem;
                right: 5px;
            }
            .candle {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновые слои -->
    <div class="bg-gothic">
        <div class="web web-1"></div>
        <div class="web web-2"></div>
        <div class="web web-3"></div>
        <div class="vignette"></div>
        <div id="dustContainer"></div>
    </div>

    <!-- Свечи -->
    <div class="candle candle-left">
        <div class="candle-body"></div>
        <div class="candle-wick"></div>
        <div class="candle-flame"></div>
    </div>
    <div class="candle candle-right">
        <div class="candle-body"></div>
        <div class="candle-wick"></div>
        <div class="candle-flame"></div>
    </div>

    <!-- Основной контент -->
    <main class="main-wrapper">
        <div class="hero">
            <h1>Правила флуда</h1>
        </div>

        <div id="rules-container"></div>
    </main>

    <script>
        // ========== ДАННЫЕ ПРАВИЛ ==========
        const rules = [
            {
                number: "I",
                title: "Конфликты",
                content: `
                    <p>Любые ссоры, ругань, срач, конфликты и т.д. — запрещены. Разбирательства проводим в личные сообщения, но никак не во флуде. Флуд создан для комфортного общения.</p>
                    <p>Все участники конфликта (те, кто начал, подхватил, продолжил, влез) получают своё наказание, в зависимости от решения администрации.</p>
                    <p>Также вызов конфликта фразами «а слабо», «поплачь» и т.д. имеет наказание. Влезать в конфликты не нужно — лучше отмечайте админов или пишите в лички админам.</p>
                `,
                punishment: "Кара: пред / мут / варн / удаление"
            },
            {
                number: "II",
                title: "Оскорбления",
                content: `
                    <p>Оскорбления запрещены так же, как и конфликты. Переход на личности, осуждение человека и всего, что с ним связано, — наказуемо.</p>
                `,
                punishment: "Кара: пред / мут"
            },
            {
                number: "III",
                title: "Табу-темы",
                content: `
                    <p>Запрещается обсуждение политики, порнографии, шок-контента и т.д. Во флуде участники разного возраста, стрессоустойчивости и нервов. Если не жалеете себя, то пожалейте хотя бы их — мы все люди и все разные.</p>
                    <p>За это можно отхватить то или иное наказание в зависимости от решения администрации.</p>
                `,
                punishment: "Кара: мут / варн / удаление"
            },
            {
                number: "IV",
                title: "Спам",
                content: `
                    <p>Запрещено присылать более 3 одинаковых сообщений / gif / стикеров / фотографий — это уже спам. Давайте будем держать флуд в чистоте и не засорять его мусором.</p>
                `,
                punishment: "Кара: мут + пред"
            },
            {
                number: "V",
                title: "Ролевая",
                content: `
                    <p>Ролить во флуде запрещено! Только если это пример поста (показать, как пишет человек, сколько, в каком стиле). Посты пишите хотя бы в две строчки, потому что посты типа «сел», «встал», «поел» тяжело продолжить.</p>
                    <p>Сюжет и т.д. обсуждаем во флуде либо в личках, у солора. Посты с 18+, шок-контентом, жестокими сценами и т.д. обязательно блюрить, с отметкой «T/W».</p>
                    <p>В ролевой нельзя убивать чужих и своих персонажей, только НПС.</p>
                `,
                punishment: "Кара: по решению администрации"
            },
            {
                number: "VI",
                title: "Чистка × Норма",
                content: `
                    <p>Чистка будет проводиться в воскресенье, в 16:00 по МСК, время может меняться в зависимости от занятости админов.</p>
                    <p>Норма: 150 сообщений. Набирать норму в день чистки запрещено (т.е. у вас 10–40 сообщений, и остальное вы набираете в день чистки).</p>
                `,
                punishment: "Кара: по решению администрации"
            },
            {
                number: "VII",
                title: "Рест",
                content: `
                    <p>Рест можно брать от 2 дней до 3 недель, в зависимости от ситуации. При желании взять рест пишите админам либо прямо во флуде, отмечая администрацию.</p>
                `,
                punishment: "—"
            },
            {
                number: "VIII",
                title: "Жалобы",
                content: `
                    <p>Жаловаться можно на участников и на администрацию, прикладывая веские доказательства (скрины и т.д.). При получении 3 жалоб — вылет.</p>
                `,
                punishment: "Кара: вылет"
            },
            {
                number: "IX",
                title: "Роли",
                content: `
                    <p>Роли можно бронировать не больше 3 дней. По истечении срока ваша роль отдаётся другому, если найдётся на неё человек.</p>
                    <p>Можно взять максимум три роли.</p>
                `,
                punishment: "—"
            },
            {
                number: "X",
                title: "Реклама",
                content: `
                    <p>Реклама своих флудов, проектов, КФ, ролок, ботов и т.д. запрещена. По договорённости с администрацией можно будет прорекламировать то, что вы хотели.</p>
                `,
                punishment: "Кара: по решению администрации"
            }
        ];

        // ========== ГЕНЕРАЦИЯ КАРТОЧЕК ==========
        const container = document.getElementById('rules-container');

        rules.forEach((rule, index) => {
            const card = document.createElement('article');
            card.className = 'rule-card';
            card.style.transitionDelay = `${index * 0.07}s`;

            const corners = `
                <div class="corner-decor top-left"></div>
                <div class="corner-decor top-right"></div>
                <div class="corner-decor bottom-left"></div>
                <div class="corner-decor bottom-right"></div>
            `;

            card.innerHTML = `
                ${corners}
                <div class="bg-number">${rule.number}</div>
                <div class="rule-number">${rule.number}</div>
                <h2 class="rule-title">${rule.title}</h2>
                <div class="rule-content">${rule.content}</div>
                <div class="punishment">${rule.punishment}</div>
            `;

            container.appendChild(card);
        });

        // ========== НАБЛЮДАТЕЛЬ ЗА ПОЯВЛЕНИЕМ ==========
        const cards = document.querySelectorAll('.rule-card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -60px 0px'
        });

        cards.forEach(card => observer.observe(card));

        // ========== ПЫЛЬ ==========
        const dustContainer = document.getElementById('dustContainer');
        const dustCount = 50;

        for (let i = 0; i < dustCount; i++) {
            const dust = document.createElement('div');
            dust.classList.add('dust');
            const size = Math.random() * 2.5 + 1;
            const left = Math.random() * 100;
            const delay = Math.random() * 20;
            const duration = Math.random() * 15 + 10;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.left = `${left}%`;
            dust.style.animationDelay = `${delay}s`;
            dust.style.animationDuration = `${duration}s`;
            dustContainer.appendChild(dust);
        }

        // ========== МЕРЦАНИЕ СВЕЧЕЙ (небольшая случайность) ==========
        setInterval(() => {
            const flames = document.querySelectorAll('.candle-flame');
            flames.forEach(flame => {
                flame.style.animationDuration = (0.1 + Math.random() * 0.2) + 's';
            });
        }, 500);
    </script>
</body>
</html>
