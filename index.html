<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила флуда · Монохром</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #050505;
            --bg-1: #0a0a0a;
            --bg-2: #111111;
            --bg-3: #1a1a1a;
            --card: rgba(20, 20, 20, 0.75);
            --card-solid: #141414;
            --border: #2a2a2a;
            --border-light: #3a3a3a;
            --text-0: #ffffff;
            --text-1: #e0e0e0;
            --text-2: #b0b0b0;
            --text-3: #808080;
            --text-4: #555555;
            --accent: #ffffff;
            --glow-white: 0 0 20px rgba(255, 255, 255, 0.3);
            --glow-strong: 0 0 40px rgba(255, 255, 255, 0.5);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-deep: 0 20px 60px rgba(0, 0, 0, 0.7);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-bounce: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--bg-0);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: var(--text-0);
            overflow-x: hidden;
            position: relative;
            cursor: default;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== ФОНОВЫЕ СЛОИ ===== */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridShift 20s linear infinite;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 100%);
        }

        @keyframes gridShift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .bg-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.8) 100%);
        }

        /* Частицы пыли */
        .dust-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .dust {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: dustFloat linear infinite;
            box-shadow: 0 0 4px rgba(255,255,255,0.5);
        }

        @keyframes dustFloat {
            0% { 
                transform: translateY(0) translateX(0); 
                opacity: 0; 
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.4; }
            100% { 
                transform: translateY(-110vh) translateX(100px); 
                opacity: 0; 
            }
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .main-wrapper {
            position: relative;
            z-index: 2;
            max-width: 850px;
            margin: 0 auto;
            padding: 5rem 1.5rem 5rem;
        }

        /* Заголовок */
        .hero {
            text-align: center;
            margin-bottom: 4.5rem;
            animation: heroEntrance 1.6s ease-out both;
        }

        @keyframes heroEntrance {
            0% { 
                opacity: 0; 
                transform: translateY(-60px) scale(0.9); 
                filter: blur(15px);
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
                filter: blur(0);
            }
        }

        .hero h1 {
            font-size: clamp(3.2rem, 8vw, 5.5rem);
            font-weight: 900;
            letter-spacing: 0.02em;
            background: linear-gradient(180deg, #ffffff 20%, #888888 50%, #444444 80%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleShimmer 5s ease-in-out infinite, titleGlow 4s ease-in-out infinite;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 80px rgba(255,255,255,0.2);
        }

        @keyframes titleShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255,255,255,0.15)); }
            50% { filter: drop-shadow(0 0 35px rgba(255,255,255,0.4)); }
        }

        .hero h1::before {
            content: '✦';
            position: absolute;
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: #fff;
            -webkit-text-fill-color: #fff;
            animation: starLeft 3s ease-in-out infinite;
        }

        .hero h1::after {
            content: '✦';
            position: absolute;
            right: -50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: #fff;
            -webkit-text-fill-color: #fff;
            animation: starRight 3s ease-in-out infinite;
        }

        @keyframes starLeft {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            50% { transform: translateY(-50%) rotate(180deg); }
        }

        @keyframes starRight {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            50% { transform: translateY(-50%) rotate(-180deg); }
        }

        /* ===== КАРТОЧКИ ===== */
        .rule-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.2rem 2.4rem;
            margin-bottom: 2.2rem;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(50px);
            will-change: transform, opacity, box-shadow, border-color;
            isolation: isolate;
        }

        .rule-card.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.7s ease-out, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s ease, border-color 0.5s ease;
        }

        .rule-card:hover {
            border-color: var(--border-light);
            box-shadow: var(--shadow-deep), var(--glow-white);
            transform: translateY(-6px);
        }

        /* Свечение при наведении */
        .rule-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--radius) + 2px);
            background: linear-gradient(135deg, #ffffff, #555555, #ffffff, #333333);
            background-size: 400% 400%;
            z-index: -2;
            opacity: 0;
            transition: opacity 0.6s ease;
            animation: borderFlow 5s linear infinite;
        }

        .rule-card:hover::before {
            opacity: 0.25;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .rule-card::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--radius) + 2px);
            background: inherit;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.6s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .rule-card:hover::after {
            opacity: 1;
        }

        /* Номер правила */
        .rule-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.2rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            margin-bottom: 0.4rem;
            display: inline-block;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
            animation: numberPulse 4s ease-in-out infinite;
            letter-spacing: -0.05em;
        }

        @keyframes numberPulse {
            0%, 100% { text-shadow: 0 0 15px rgba(255,255,255,0.3); }
            50% { text-shadow: 0 0 35px rgba(255,255,255,0.7); }
        }

        .rule-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 1.2rem;
            position: relative;
            display: inline-block;
            transition: var(--transition);
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }

        .rule-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #fff, #888);
            border-radius: 2px;
            transition: width 0.5s ease;
            box-shadow: 0 0 12px rgba(255,255,255,0.5);
        }

        .rule-card:hover .rule-title::after {
            width: 100%;
        }

        .rule-card:hover .rule-title {
            text-shadow: 0 0 30px rgba(255,255,255,0.4);
        }

        /* Контент */
        .rule-content {
            color: var(--text-2);
            line-height: 1.75;
            font-size: 0.98rem;
            margin-top: 0.5rem;
        }

        .rule-content p {
            margin-bottom: 0.7rem;
            position: relative;
            padding-left: 0.5rem;
            transition: color 0.3s ease;
        }

        .rule-card:hover .rule-content p {
            color: var(--text-1);
        }

        /* Наказание */
        .punishment {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.55rem 1.8rem;
            background: rgba(255,255,255,0.04);
            border-left: 3px solid #fff;
            border-radius: 0 12px 12px 0;
            font-weight: 600;
            font-size: 0.9rem;
            color: #fff;
            letter-spacing: 0.04em;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .punishment::before {
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.8s ease;
        }

        .rule-card:hover .punishment {
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 25px rgba(255,255,255,0.2);
            border-left-color: #fff;
        }

        .rule-card:hover .punishment::before {
            left: 100%;
        }

        /* Декоративные углы */
        .rule-card .corner-decor {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 1px solid var(--border-light);
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 1;
        }

        .rule-card .corner-decor.top-left {
            top: 8px;
            left: 8px;
            border-right: none;
            border-bottom: none;
            border-radius: 6px 0 0 0;
        }

        .rule-card .corner-decor.top-right {
            top: 8px;
            right: 8px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 6px 0 0;
        }

        .rule-card .corner-decor.bottom-left {
            bottom: 8px;
            left: 8px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 6px;
        }

        .rule-card .corner-decor.bottom-right {
            bottom: 8px;
            right: 8px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 6px 0;
        }

        .rule-card:hover .corner-decor {
            opacity: 1;
            border-color: #555;
        }

        /* Микро-деталь: номер в фоне */
        .rule-card .bg-number {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 8rem;
            font-weight: 700;
            color: rgba(255,255,255,0.03);
            pointer-events: none;
            z-index: 0;
            transition: color 0.4s ease;
            user-select: none;
        }

        .rule-card:hover .bg-number {
            color: rgba(255,255,255,0.06);
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 600px) {
            .rule-card {
                padding: 1.5rem 1.2rem;
            }
            .rule-title {
                font-size: 1.6rem;
            }
            .rule-number {
                font-size: 2.5rem;
            }
            .hero h1 {
                font-size: 2.8rem;
            }
            .hero h1::before,
            .hero h1::after {
                display: none;
            }
            .rule-card .bg-number {
                font-size: 5rem;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновые слои -->
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
    <div class="dust-particles" id="dust"></div>

    <!-- Основной контент -->
    <main class="main-wrapper">
        <div class="hero">
            <h1>Правила флуда</h1>
        </div>

        <div id="rules-container"></div>
    </main>

    <script>
        // ========== ДАННЫЕ ПРАВИЛ ==========
        const rules = [
            {
                number: "01",
                title: "Конфликты",
                content: `
                    <p>Любые ссоры, ругань, срач, конфликты и т.д. — запрещены. Разбирательства проводим в личные сообщения, но никак не во флуде. Флуд создан для комфортного общения.</p>
                    <p>Все участники конфликта (те, кто начал, подхватил, продолжил, влез) получают своё наказание, в зависимости от решения администрации.</p>
                    <p>Также вызов конфликта фразами «а слабо», «поплачь» и т.д. имеет наказание. Влезать в конфликты не нужно — лучше отмечайте админов или пишите в лички админам.</p>
                `,
                punishment: "Кара: пред / мут / варн / удаление"
            },
            {
                number: "02",
                title: "Оскорбления",
                content: `
                    <p>Оскорбления запрещены так же, как и конфликты. Переход на личности, осуждение человека и всего, что с ним связано, — наказуемо.</p>
                `,
                punishment: "Кара: пред / мут"
            },
            {
                number: "03",
                title: "Табу-темы",
                content: `
                    <p>Запрещается обсуждение политики, порнографии, шок-контента и т.д. Во флуде участники разного возраста, стрессоустойчивости и нервов. Если не жалеете себя, то пожалейте хотя бы их — мы все люди и все разные.</p>
                    <p>За это можно отхватить то или иное наказание в зависимости от решения администрации.</p>
                `,
                punishment: "Кара: мут / варн / удаление"
            },
            {
                number: "04",
                title: "Спам",
                content: `
                    <p>Запрещено присылать более 3 одинаковых сообщений / gif / стикеров / фотографий — это уже спам. Давайте будем держать флуд в чистоте и не засорять его мусором.</p>
                `,
                punishment: "Кара: мут + пред"
            },
            {
                number: "05",
                title: "Ролевая",
                content: `
                    <p>Ролить во флуде запрещено! Только если это пример поста (показать, как пишет человек, сколько, в каком стиле). Посты пишите хотя бы в две строчки, потому что посты типа «сел», «встал», «поел» тяжело продолжить.</p>
                    <p>Сюжет и т.д. обсуждаем во флуде либо в личках, у солора. Посты с 18+, шок-контентом, жестокими сценами и т.д. обязательно блюрить, с отметкой «T/W».</p>
                    <p>В ролевой нельзя убивать чужих и своих персонажей, только НПС.</p>
                `,
                punishment: "Кара: по решению администрации"
            },
            {
                number: "06",
                title: "Чистка × Норма",
                content: `
                    <p>Чистка будет проводиться в воскресенье, в 16:00 по МСК, время может меняться в зависимости от занятости админов.</p>
                    <p>Норма: 150 сообщений. Набирать норму в день чистки запрещено (т.е. у вас 10–40 сообщений, и остальное вы набираете в день чистки).</p>
                `,
                punishment: "Кара: по решению администрации"
            },
            {
                number: "07",
                title: "Рест",
                content: `
                    <p>Рест можно брать от 2 дней до 3 недель, в зависимости от ситуации. При желании взять рест пишите админам либо прямо во флуде, отмечая администрацию.</p>
                `,
                punishment: "—"
            },
            {
                number: "08",
                title: "Жалобы",
                content: `
                    <p>Жаловаться можно на участников и на администрацию, прикладывая веские доказательства (скрины и т.д.). При получении 3 жалоб — вылет.</p>
                `,
                punishment: "Кара: вылет"
            },
            {
                number: "09",
                title: "Роли",
                content: `
                    <p>Роли можно бронировать не больше 3 дней. По истечении срока ваша роль отдаётся другому, если найдётся на неё человек.</p>
                    <p>Можно взять максимум три роли.</p>
                `,
                punishment: "—"
            },
            {
                number: "10",
                title: "Реклама",
                content: `
                    <p>Реклама своих флудов, проектов, КФ, ролок, ботов и т.д. запрещена. По договорённости с администрацией можно будет прорекламировать то, что вы хотели.</p>
                `,
                punishment: "Кара: по решению администрации"
            }
        ];

        // ========== ГЕНЕРАЦИЯ КАРТОЧЕК ==========
        const container = document.getElementById('rules-container');

        rules.forEach((rule, index) => {
            const card = document.createElement('article');
            card.className = 'rule-card';
            card.style.transitionDelay = `${index * 0.06}s`;

            const corners = `
                <div class="corner-decor top-left"></div>
                <div class="corner-decor top-right"></div>
                <div class="corner-decor bottom-left"></div>
                <div class="corner-decor bottom-right"></div>
            `;

            card.innerHTML = `
                ${corners}
                <div class="bg-number">${rule.number}</div>
                <div class="rule-number">№ ${rule.number}</div>
                <h2 class="rule-title">${rule.title}</h2>
                <div class="rule-content">${rule.content}</div>
                <div class="punishment">${rule.punishment}</div>
            `;

            container.appendChild(card);
        });

        // ========== НАБЛЮДАТЕЛЬ ЗА ПОЯВЛЕНИЕМ ==========
        const cards = document.querySelectorAll('.rule-card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -60px 0px'
        });

        cards.forEach(card => observer.observe(card));

        // ========== ПЫЛЕВЫЕ ЧАСТИЦЫ ==========
        const dustContainer = document.getElementById('dust');
        const dustCount = 45;

        for (let i = 0; i < dustCount; i++) {
            const dust = document.createElement('div');
            dust.classList.add('dust');

            const size = Math.random() * 3 + 1; // 1-4px
            const left = Math.random() * 100;
            const delay = Math.random() * 20;
            const duration = Math.random() * 15 + 10; // 10-25s
            const opacityMax = Math.random() * 0.5 + 0.3;

            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.left = `${left}%`;
            dust.style.animationDelay = `${delay}s`;
            dust.style.animationDuration = `${duration}s`;
            dust.style.setProperty('--opacity-max', opacityMax);

            dustContainer.appendChild(dust);
        }

        // Переопределяем keyframes для пыли с учётом opacity
        const dustStyle = document.createElement('style');
        dustStyle.textContent = `
            @keyframes dustFloat {
                0% { 
                    transform: translateY(0) translateX(0); 
                    opacity: 0; 
                }
                10% { opacity: var(--opacity-max, 0.5); }
                90% { opacity: calc(var(--opacity-max, 0.5) * 0.7); }
                100% { 
                    transform: translateY(-110vh) translateX(80px); 
                    opacity: 0; 
                }
            }
        `;
        document.head.appendChild(dustStyle);

        // ========== ПАРАЛЛАКС ФОНА ==========
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const grid = document.querySelector('.bg-grid');
            const vignette = document.querySelector('.bg-vignette');
            if (grid) grid.style.transform = `translateY(${scrollY * 0.1}px)`;
            if (vignette) vignette.style.transform = `translateY(${scrollY * -0.05}px)`;
        });
    </script>
</body>
</html>
